<mat-sidenav-container class="container">
  <mat-sidenav #sidenav mode="over">
    <mat-toolbar>
      <button matIconButton type="button" (click)="sidenav.toggle()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-toolbar>
    <mat-list>
      <mat-list-item routerLink="/realms" class="list-item">
        <button type="button" matFab extended class="mat-fab-button">
          <mat-icon>castle</mat-icon>
          Realms
        </button>
      </mat-list-item>
    </mat-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <button matIconButton type="button" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer">
        <div class="logo-box" routerLink="/">
          <a href="/.">
            <img
              src="assets/images/Homestone_Icon.png"
              alt="Homestone Icon"
              class="header-logo"
            />
          </a>
        </div>
      </span>
    </mat-toolbar>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
